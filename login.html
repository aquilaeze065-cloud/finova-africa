<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finova Africa – Sign In / Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{--green:#2ecc71;--green-dark:#27ae60;--green-glow:rgba(46,204,113,0.2);--bg-card:rgba(10,20,45,0.78);--input-bg:rgba(255,255,255,0.06);--input-border:rgba(255,255,255,0.12);--text:#e8f0fe;--muted:#8fa8cc;}
    html,body{min-height:100vh;font-family:'DM Sans',sans-serif;color:var(--text);overflow-x:hidden;}
    body{background:radial-gradient(ellipse 70% 60% at 15% 20%,rgba(30,60,120,0.55) 0%,transparent 65%),radial-gradient(ellipse 60% 50% at 85% 75%,rgba(20,80,60,0.4) 0%,transparent 65%),radial-gradient(ellipse 80% 70% at 50% 50%,rgba(15,30,70,0.6) 0%,transparent 70%),linear-gradient(160deg,#060d1f 0%,#0a1530 40%,#071020 100%);position:relative;}
    body::before{content:'';position:fixed;inset:0;z-index:0;background-image:radial-gradient(circle,rgba(255,255,255,0.6) 1px,transparent 1px),radial-gradient(circle,rgba(46,204,113,0.3) 1px,transparent 1px);background-size:80px 80px,130px 130px;background-position:0 0,40px 40px;opacity:0.18;animation:drift 25s linear infinite;}
    @keyframes drift{from{background-position:0 0,40px 40px}to{background-position:80px 80px,120px 120px}}
    .page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;}
    .logo-wrap{display:flex;align-items:center;gap:0.9rem;margin-bottom:0.9rem;animation:fadeDown 0.6s ease both;}
    .shield{width:64px;height:64px;background:linear-gradient(145deg,#1a4a3a,#0d2a4a);border:2px solid rgba(46,204,113,0.4);border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(46,204,113,0.25);}
    .shield svg{width:36px;height:36px;}
    .logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;line-height:1.1;}
    .logo-text span{color:var(--green);}
    .tagline{font-size:0.95rem;color:var(--muted);margin-bottom:1.8rem;text-align:center;animation:fadeDown 0.6s 0.1s ease both;}
    .card{width:100%;max-width:480px;background:var(--bg-card);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:2.2rem 2rem;backdrop-filter:blur(24px);box-shadow:0 24px 60px rgba(0,0,0,0.5),0 0 0 1px rgba(46,204,113,0.06);animation:fadeUp 0.6s 0.2s ease both;}
    .tabs{display:flex;gap:0;margin-bottom:1.8rem;border-bottom:1px solid rgba(255,255,255,0.1);}
    .tab{flex:1;text-align:center;padding:0.7rem 0;font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color 0.2s,border-color 0.2s;background:none;border-top:none;border-left:none;border-right:none;}
    .tab.active{color:var(--text);border-bottom-color:var(--green);}
    .form-panel{display:none;}
    .form-panel.active{display:block;}
    .input-group{position:relative;margin-bottom:1rem;}
    .input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1rem;pointer-events:none;}
    input[type="text"],input[type="email"],input[type="password"]{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:12px;padding:0.85rem 1rem 0.85rem 2.8rem;font-family:'DM Sans',sans-serif;font-size:0.95rem;color:var(--text);outline:none;transition:border-color 0.2s,background 0.2s,box-shadow 0.2s;}
    input::placeholder{color:var(--muted);}
    input:focus{border-color:var(--green);background:rgba(46,204,113,0.06);box-shadow:0 0 0 3px rgba(46,204,113,0.1);}
    .show-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--green);font-size:0.85rem;font-weight:600;font-family:'DM Sans',sans-serif;}
    .checkbox-row{display:flex;align-items:center;gap:0.6rem;margin:0.6rem 0 1.2rem;font-size:0.88rem;color:var(--muted);}
    .checkbox-row input[type="checkbox"]{width:18px;height:18px;padding:0;accent-color:var(--green);border-radius:4px;cursor:pointer;}
    .checkbox-row a{color:var(--green);text-decoration:none;}
    .forgot-row{text-align:right;margin-bottom:1rem;}
    .forgot-row a{font-size:0.85rem;color:var(--green);text-decoration:none;}
    .btn-submit{width:100%;padding:0.95rem;background:linear-gradient(90deg,#27ae60,#2ecc71);border:none;border-radius:12px;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:1.05rem;color:#05100a;box-shadow:0 0 28px rgba(46,204,113,0.4);transition:all 0.2s;margin-bottom:1.2rem;}
    .btn-submit:hover{transform:translateY(-2px);box-shadow:0 0 42px rgba(46,204,113,0.6);}
    .switch-text{text-align:center;font-size:0.88rem;color:var(--muted);}
    .switch-text a{color:var(--green);font-weight:600;text-decoration:none;cursor:pointer;}
    .divider{display:flex;align-items:center;gap:1rem;margin:1.6rem 0 1rem;color:var(--muted);font-size:0.82rem;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1);}
    .social-btns{display:flex;justify-content:center;gap:1rem;margin-bottom:0.5rem;}
    .social-btn{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;transition:background 0.2s,border-color 0.2s,transform 0.15s;color:var(--text);text-decoration:none;}
    .social-btn:hover{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.3);transform:translateY(-2px);}
    .page-footer{margin-top:1.8rem;font-size:0.78rem;color:rgba(138,168,204,0.55);text-align:center;animation:fadeUp 0.6s 0.4s ease both;}
    .page-footer a{color:var(--green);text-decoration:none;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
    @keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
  </style>
</head>
<body>
<div class="page">
  <div class="logo-wrap">
    <div class="shield">
      <svg viewBox="0 0 40 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 2L4 9v12c0 9.9 6.8 19.2 16 22 9.2-2.8 16-12.1 16-22V9L20 2z" fill="rgba(46,204,113,0.15)" stroke="#2ecc71" stroke-width="1.5"/>
        <polyline points="10,22 17,29 30,15" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="logo-text">Finova<br/><span>Africa</span></div>
  </div>
  <p class="tagline">Securely grow and manage your wealth across Africa.</p>
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
      <button class="tab" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
    </div>
    <div class="form-panel active" id="panel-signup">
      <div class="input-group"><span class="input-icon">👤</span><input type="text" placeholder="Full Name"/></div>
      <div class="input-group"><span class="input-icon">✉️</span><input type="email" placeholder="Email"/></div>
      <div class="input-group"><span class="input-icon">🔒</span><input type="password" id="pw1" placeholder="Password"/><button class="show-btn" onclick="togglePw('pw1',this)">Show</button></div>
      <div class="input-group"><span class="input-icon">🔒</span><input type="password" id="pw2" placeholder="Confirm Password"/><button class="show-btn" onclick="togglePw('pw2',this)">Show</button></div>
      <div class="checkbox-row"><input type="checkbox" id="terms" checked/><label for="terms">I agree to the <a href="#">Terms &amp; Conditions</a></label></div>
      <button class="btn-submit" onclick="location.href='dashboard.html'">Sign Up</button>
      <p class="switch-text">Already have an account? <a onclick="switchTab('signin')">Sign In</a></p>
    </div>
    <div class="form-panel" id="panel-signin">
      <div class="input-group"><span class="input-icon">✉️</span><input type="email" placeholder="Email"/></div>
      <div class="input-group"><span class="input-icon">🔒</span><input type="password" id="pw3" placeholder="Password"/><button class="show-btn" onclick="togglePw('pw3',this)">Show</button></div>
      <div class="forgot-row"><a href="#">Forgot password?</a></div>
      <button class="btn-submit" onclick="location.href='dashboard.html'">Sign In</button>
      <p class="switch-text">Don't have an account? <a onclick="switchTab('signup')">Sign Up</a></p>
    </div>
    <div class="divider">Or continue with</div>
    <div class="social-btns">
      <a href="#" class="social-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="#4267B2"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg></a>
      <a href="#" class="social-btn"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg></a>
      <a href="#" class="social-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="#0077B5"><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2" fill="#0077B5"/></svg></a>
    </div>
  </div>
  <p class="page-footer">© 2026 Finova Africa. All rights reserved. | <a href="#">Privacy Policy</a></p>
</div>
<script>
  function switchTab(tab){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.form-panel').forEach(p=>p.classList.remove('active'));document.getElementById('tab-'+tab).classList.add('active');document.getElementById('panel-'+tab).classList.add('active');}
  function togglePw(id,btn){const input=document.getElementById(id);if(input.type==='password'){input.type='text';btn.textContent='Hide';}else{input.type='password';btn.textContent='Show';}}
</script>
</body>
</html>
